[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements-prod.txt && python manage.py collectstatic --no-input"

[deploy]
releaseCommand = "python manage.py migrate && python manage.py seed_modules && python manage.py seed_super_admin"
startCommand = "gunicorn Hostel_Management_System.wsgi --bind 0.0.0.0:$PORT --log-file -"
