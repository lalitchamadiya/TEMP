{% extends "student_base.html" %}

{% load static %}
{% block content %}

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="pro-card shadow-lg p-5 border-0">
                <div class="text-center mb-4">
                    <div class="d-inline-flex justify-content-center align-items-center bg-primary text-white rounded-circle mb-3 shadow" style="width: 60px; height: 60px;">
                        <span class="material-symbols-outlined" style="font-size: 32px;">lock_reset</span>
                    </div>
                    <h3 class="text-dark fw-bold">Change Password</h3>
                    <p class="text-muted small">It's a good idea to use a strong password</p>
                </div>
                <form method="post" action="{% url 'student_app:change_password' %}">
                    {% csrf_token %}
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show bg-opacity-10 shadow-sm" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <!-- Current Password -->
                    <div class="mb-4 position-relative">
                        <label class="form-label small fw-bold text-muted px-1">Current Password</label>
                        <div class="input-group drop-shadow-sm">
                            <span class="input-group-text bg-white border-end-0 text-primary"><span class="material-symbols-outlined fs-5">lock_open</span></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="old_password" name="old_password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- New Password -->
                    <div class="mb-4 position-relative">
                        <label class="form-label small fw-bold text-muted px-1">New Password</label>
                        <div class="input-group drop-shadow-sm">
                            <span class="input-group-text bg-white border-end-0 text-primary"><span class="material-symbols-outlined fs-5">key</span></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="new_password1" name="new_password1" placeholder="Create strong string" required>
                        </div>
                    </div>

                    <!-- Confirm New Password -->
                    <div class="mb-4 position-relative">
                        <label class="form-label small fw-bold text-muted px-1">Verify Password</label>
                        <div class="input-group drop-shadow-sm">
                            <span class="input-group-text bg-white border-end-0 text-success"><span class="material-symbols-outlined fs-5">check_circle</span></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="new_password2" name="new_password2" placeholder="Re-enter to confirm" required>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid mt-5">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow fs-6 py-2 fw-bold d-inline-flex justify-content-center align-items-center">
                            Save Configuration <span class="material-symbols-outlined ms-2 fs-5">arrow_forward</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
