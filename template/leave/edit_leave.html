{% extends "base.html" %}
{% load static %}
{% block content %}

<nav class="navbar navbar-light bg-light my-4 mx-1 py-2 shadow-sm">
    <div class="container-fluid">
        <h5 class="navbar-title mb-0 mx-1">Hostel Leave Management</h5>
    </div>
</nav>
{% include 'leave/leave_nav.html' %}



<form method="post">
    {% csrf_token %}
    <h5 class="mt-3 d-flex align-item-center">
        <span class="material-symbols-outlined text-muted" style="font-size: 25px; margin-right:2px;">keyboard_double_arrow_right</span>
        Edit Leave
    </h5>
    <div class="pro-card mt-3">
        <div class="card-body p-4">
            <div class="row g-4">
                <div class="col-md-3 text-center">
                    <img src="/static/image/Picsart_22-12-14_11-42-15-.jpg" alt="User Photo" class="img-fluid rounded-circle border border-primary shadow-sm" width="120" height="120" />
                </div>
                <div class="col-md-9">
                    <div class="row g-4">
                        <div class="col-md-4">
                            <label for="enrollment" class="form-label text-muted small fw-semibold mb-1">Roll / Enrollment No</label>
                            <input type="text" class="form-control form-control-sm fw-medium pb-2 bg-light" value="{{ student_details.roll }}" disabled />
                            <input type="hidden" name="enrollment_number" value="{{ student_details.roll }}" />
                        </div>
                        <div class="col-md-4">
                            <label for="name" class="form-label text-muted small fw-semibold mb-1">Name</label>
                            <input type="text" class="form-control form-control-sm fw-medium pb-2 bg-light" value="{{ student_details.name }}" disabled />
                            <input type="hidden" name="user_name" value="{{ student_details.name }}" />
                        </div>
                        <div class="col-md-4">
                            <label for="contact_no" class="form-label text-muted small fw-semibold mb-1">Contact No</label>
                            <input type="text" class="form-control form-control-sm fw-medium pb-2 bg-light" value="{{ student_details.phone_number }}" disabled />
                            <input type="hidden" name="contact_no" value="{{ student_details.phone_number }}" />
                        </div>
                        <div class="col-md-4">
                            <label for="reason" class="form-label text-muted small fw-semibold mb-1">Reason</label>
                            <input type="text" name="reason" class="form-control form-control-sm pb-2" placeholder="Type Reason" value="{{ leave.reason }}" required />
                        </div>
                        <div class="col-md-4">
                            <label for="leave_date" class="form-label text-muted small fw-semibold mb-1">Leave Date</label>
                            <input type="date" name="leave_date" class="form-control form-control-sm pb-2" value="{{ leave.leave_from|date:'Y-m-d' }}" required />
                        </div>
                        <div class="col-md-4 d-flex align-items-end mb-1">
                            <button type="submit" class="rounded-1 btn btn-primary px-4 shadow-sm w-100">
                                Update Leave
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>







{% endblock %}
