{% load static %}

<style>
    /* ── Leave Nav: Dark Mode + Mobile ─────────────────────────────── */
    .leave-nav-wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1.25rem;
        padding: 0.5rem 0.75rem;
        border-radius: 50rem;
        background: var(--card-bg, rgba(255,255,255,0.7));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--header-border, rgba(255,255,255,0.4));
        box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    /* Scrollable pill row on small screens */
    .leave-nav-pills {
        display: flex;
        gap: 0.25rem;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        flex: 1 1 auto;
        min-width: 0;
    }
    .leave-nav-pills::-webkit-scrollbar { display: none; }

    .leave-nav-pills .nav-link {
        color: var(--text-muted, #64748b);
        font-weight: 600;
        font-size: 0.82rem;
        padding: 0.45rem 1rem;
        border-radius: 50rem;
        white-space: nowrap;
        flex-shrink: 0;
        transition: all 0.2s ease;
        border: 1px solid transparent;
        text-decoration: none;
    }
    .leave-nav-pills .nav-link:hover {
        background: rgba(244, 63, 94, 0.08);
        color: #f43f5e;
    }
    .leave-nav-pills .nav-link.active {
        background: #f43f5e !important;
        color: white !important;
        box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25);
    }

    /* Dark mode overrides */
    html[data-theme="dark"] .leave-nav-pills .nav-link {
        color: var(--text-muted, #94a3b8);
    }
    html[data-theme="dark"] .leave-nav-pills .nav-link:hover {
        background: rgba(244, 63, 94, 0.15);
        color: #fb7185;
    }

    /* Search box */
    .leave-search-box {
        flex-shrink: 0;
        position: relative;
        width: 200px;
    }
    .leave-search-box .bi-search {
        position: absolute;
        left: 0.85rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted, #94a3b8);
        font-size: 0.85rem;
        pointer-events: none;
        z-index: 2;
    }
    .leave-search-box .form-control {
        padding-left: 2.25rem;
        border-radius: 50rem;
        font-size: 0.82rem;
        background: var(--input-bg, rgba(255,255,255,0.9)) !important;
        border: 1px solid var(--header-border, #e2e8f0) !important;
        color: var(--text-main, #1e293b) !important;
    }
    .leave-search-box .form-control::placeholder { color: var(--text-muted, #94a3b8); }
    .leave-search-box .form-control:focus {
        box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.12) !important;
        border-color: #f43f5e !important;
    }

    @media (max-width: 576px) {
        .leave-nav-wrap {
            border-radius: 1rem;
            padding: 0.5rem;
        }
        .leave-search-box { width: 100%; }
        .leave-nav-pills .nav-link {
            padding: 0.4rem 0.75rem;
            font-size: 0.78rem;
        }
        .leave-nav-pills .nav-link i { margin-right: 0 !important; }
        .leave-nav-pills .nav-link span.nav-label { display: none; }
    }
</style>

<div class="leave-nav-wrap">
    <div class="leave-nav-pills">
        <a href="{% url 'leave_base' %}" class="nav-link {% if request.resolver_match.url_name == 'leave_base' %}active{% endif %}">
            <i class="bi bi-house-door me-1"></i><span class="nav-label">Dashboard</span>
        </a>
        <a href="{% url 'pending_leave' %}" class="nav-link {% if request.resolver_match.url_name == 'pending_leave' %}active{% endif %}">
            <i class="bi bi-hourglass-split me-1"></i><span class="nav-label">Pending</span>
        </a>
        <a href="{% url 'leave_record' %}" class="nav-link {% if request.resolver_match.url_name == 'leave_record' %}active{% endif %}">
            <i class="bi bi-journal-text me-1"></i><span class="nav-label">Records</span>
        </a>
        <a href="{% url 'add_leave' %}" class="nav-link {% if request.resolver_match.url_name == 'add_leave' %}active{% endif %}">
            <i class="bi bi-plus-circle me-1"></i><span class="nav-label">Add Leave</span>
        </a>
        <a href="{% url 'gate_pass_management' %}" class="nav-link {% if request.resolver_match.url_name == 'gate_pass_management' %}active{% endif %}">
            <i class="bi bi-qr-code-scan me-1"></i><span class="nav-label">Gate Passes</span>
        </a>
        <a href="{% url 'leave_reports' %}" class="nav-link {% if request.resolver_match.url_name == 'leave_reports' %}active{% endif %}">
            <i class="bi bi-file-earmark-bar-graph me-1"></i><span class="nav-label">Reports</span>
        </a>
        <a href="{% url 'security_dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'security_dashboard' %}active{% endif %}">
            <i class="bi bi-shield-check me-1"></i><span class="nav-label">Security Gate</span>
        </a>
    </div>

    <div class="leave-search-box">
        <i class="bi bi-search"></i>
        <form method="get" action="">
            <input type="search" name="q" class="form-control form-control-sm" placeholder="Search requests..." value="{{ request.GET.q }}">
        </form>
    </div>
</div>
