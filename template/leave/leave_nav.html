{% load static %}

<style>
    .leave-nav-pills .nav-link {
        color: #64748b;
        font-weight: 600;
        font-size: 0.85rem;
        padding: 0.5rem 1.25rem;
        border-radius: 50rem;
        transition: all 0.2s ease;
        border: 1px solid transparent;
    }
    .leave-nav-pills .nav-link:hover {
        background: rgba(244, 63, 94, 0.05);
        color: #f43f5e;
    }
    .leave-nav-pills .nav-link.active {
        background: #f43f5e !important;
        color: white !important;
        box-shadow: 0 4px 12px rgba(244, 63, 94, 0.2);
    }
    .search-group-premium {
        position: relative;
        max-width: 300px;
    }
    .search-group-premium .form-control {
        padding-left: 2.5rem;
        border-radius: 50rem;
        background: rgba(255,255,255,0.8);
        border: 1px solid #e2e8f0;
    }
    .search-group-premium .bi-search {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
    }
</style>

<div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4 p-2 glass-card" style="border-radius: 50rem;">
    <div class="leave-nav-pills d-flex gap-1">
        <a href="{% url 'leave_base' %}" class="nav-link {% if request.resolver_match.url_name == 'leave_base' %}active{% endif %}">
            <i class="bi bi-house-door me-2"></i>Dashboard
        </a>
        <a href="{% url 'pending_leave' %}" class="nav-link {% if request.resolver_match.url_name == 'pending_leave' %}active{% endif %}">
            <i class="bi bi-hourglass-split me-2"></i>Pending
        </a>
        <a href="{% url 'leave_record' %}" class="nav-link {% if request.resolver_match.url_name == 'leave_record' %}active{% endif %}">
            <i class="bi bi-journal-text me-2"></i>Records
        </a>
        <a href="{% url 'add_leave' %}" class="nav-link {% if request.resolver_match.url_name == 'add_leave' %}active{% endif %}">
            <i class="bi bi-plus-circle me-2"></i>Add Leave
        </a>
        <a href="{% url 'gate_pass_management' %}" class="nav-link {% if request.resolver_match.url_name == 'gate_pass_management' %}active{% endif %}">
            <i class="bi bi-qr-code-scan me-2"></i>Gate Passes
        </a>
        <a href="{% url 'leave_reports' %}" class="nav-link {% if request.resolver_match.url_name == 'leave_reports' %}active{% endif %}">
            <i class="bi bi-file-earmark-bar-graph me-2"></i>Reports
        </a>
    </div>

    <div class="search-group-premium me-2">
        <i class="bi bi-search"></i>
        <form method="get" action="">
            <input type="search" name="q" class="form-control form-control-sm" placeholder="Search requests..." aria-label="Search">
        </form>
    </div>
</div>
