{% load static %}

<!-- Shared Accounting Navigation Bar -->
<div class="card border-0 shadow-sm mb-4 rounded-3 overflow-hidden">
    <div class="card-body p-0">
        <div class="d-flex align-items-stretch overflow-x-auto flex-nowrap">
            <a href="{% url 'paybill_base' %}" class="paybill-nav-link {% if request.resolver_match.url_name == 'paybill_base' %}active{% endif %}">
                <i class="material-symbols-outlined">dashboard</i>
                <span>Overview</span>
            </a>
            <a href="{% url 'collect_fees' %}" class="paybill-nav-link {% if request.resolver_match.url_name == 'collect_fees' or request.resolver_match.url_name == 'check_enrollment_fee' %}active{% endif %}">
                <i class="material-symbols-outlined">point_of_sale</i>
                <span>Collect Fees</span>
            </a>
            <a href="{% url 'pending_fees' %}" class="paybill-nav-link {% if request.resolver_match.url_name == 'pending_fees' %}active{% endif %}">
                <i class="material-symbols-outlined">pending_actions</i>
                <span>Pending Dues</span>
            </a>
            <a href="{% url 'transaction_record' %}" class="paybill-nav-link {% if request.resolver_match.url_name == 'transaction_record' %}active{% endif %}">
                <i class="material-symbols-outlined">receipt_long</i>
                <span>Transactions</span>
            </a>
            <a href="{% url 'fee_structure' %}" class="paybill-nav-link {% if request.resolver_match.url_name == 'fee_structure' %}active{% endif %}">
                <i class="material-symbols-outlined">account_balance</i>
                <span>Fee Structure</span>
            </a>
            <a href="{% url 'admin_analytics' %}" class="paybill-nav-link {% if request.resolver_match.url_name == 'admin_analytics' %}active{% endif %} ms-auto">
                <i class="material-symbols-outlined">bar_chart</i>
                <span>Analytics</span>
            </a>
        </div>
    </div>
</div>

<style>
.paybill-nav-link {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 1rem 1.4rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: #64748b;
    text-decoration: none;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: all 0.2s ease;
}
.paybill-nav-link:hover {
    color: #2563eb;
    background: rgba(37,99,235,0.04);
}
.paybill-nav-link.active {
    color: #2563eb;
    border-bottom-color: #2563eb;
    background: rgba(37,99,235,0.05);
}
.paybill-nav-link i {
    font-size: 1.1rem;
}
</style>
