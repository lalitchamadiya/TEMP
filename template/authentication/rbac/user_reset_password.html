{% extends 'base.html' %}
{% load static %}

{% block title %} | Reset Password{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="rounded-circle bg-warning bg-opacity-10 text-warning d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                            <i class="bi bi-shield-lock display-4"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Reset Password</h3>
                        <p class="text-muted small">Set a new password for user <strong>@{{ target.username }}</strong>.</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key-fill"></i></span>
                                <input type="password" name="new_password" class="form-control border-start-0 bg-light" placeholder="Enter new password" required minlength="6">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small text-secondary">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-check-all"></i></span>
                                <input type="password" name="confirm_password" class="form-control border-start-0 bg-light" placeholder="Repeat new password" required minlength="6">
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning py-2 fw-bold text-dark">
                                <i class="bi bi-arrow-repeat me-2"></i>Reset Password
                            </button>
                            <a href="{% url 'user_management' %}" class="btn btn-light py-2">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
                <div class="card-footer bg-light border-0 py-3 text-center">
                    <p class="mb-0 text-muted small"><i class="bi bi-info-circle me-1"></i> The user will be required to use this new password for their next login.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
