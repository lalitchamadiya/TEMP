{% extends 'base_auth.html'%}
{% load static %}

{% block content %}

<nav class="navbar top-nav sticky-top">
    <div class="container-fluid justify-content-between align-items-center py-2 px-4">
        <h4 class="navbar-brand mb-0">Hostel Management System</h4>
        <button id="themeToggleBtn" class="btn btn-sm theme-toggle-btn" type="button" title="Toggle Theme" aria-label="Toggle Light/Dark Theme">
          <i class="bi bi-moon-fill" id="themeIcon"></i>
        </button>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 80px);">
    <div class="pro-card shadow-lg" style="max-width: 900px; width: 100%; overflow: hidden;">
        <div class="row g-0">
            <!-- Image Side -->
            <div class="col-md-6 d-none d-md-block" style="background: url('/static/image/6343825.jpg') center center/cover no-repeat; min-height: 450px;">
                <div class="h-100 w-100" style="background: rgba(37, 99, 235, 0.1);"></div>
            </div>
            
            <!-- Login Form Side -->
            <div class="col-md-6 d-flex flex-column justify-content-center p-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex justify-content-center align-items-center bg-primary text-white rounded-circle mb-3 shadow" style="width: 60px; height: 60px;">
                        <span class="material-symbols-outlined" style="font-size: 32px;">vpn_key</span>
                    </div>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-muted small">Enter your credentials to access your dashboard</p>
                </div>
                
                <form action="{% url 'login' %}" method="post">
                    {% csrf_token %}
                    {% include '_messages.html' %}
                    
                    <div class="mb-4 position-relative">
                        <label class="form-label small fw-bold text-muted px-1">Username</label>
                        <div class="input-group drop-shadow-sm">
                            <span class="input-group-text border-end-0 text-primary">
                                <span class="material-symbols-outlined fs-5">person</span>
                            </span>
                            <input type="text" name="username" placeholder="Student Roll or Admin ID" id="usernameField" value="{{fieldValues.username}}" class="form-control border-start-0 ps-0" autocomplete="username" required>
                        </div>
                    </div>
                    
                    <div class="mb-4 position-relative">
                        <label class="form-label small fw-bold text-muted px-1">Password</label>
                        <div class="input-group drop-shadow-sm">
                            <span class="input-group-text border-end-0 text-primary">
                                <span class="material-symbols-outlined fs-5">lock</span>
                            </span>
                            <input type="password" name="password" placeholder="••••••••" id="passwordField" class="form-control border-start-0 ps-0" autocomplete="current-password" required>
                        </div>
                    </div>
                    
                    <div class="d-grid mt-5">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow fs-6 py-2 fw-bold">Sign In</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="{% static 'javaScript/register.js' %}"></script>

{% endblock %}
