{% extends 'base.html' %}
{% block title %}| Assign Subscription{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4 gap-2">
  <a href="{% url 'subscription_list' %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
  <div>
    <h4 class="fw-bold mb-0"><i class="bi bi-magic me-2 text-primary"></i>Assign Subscription</h4>
    <p class="text-muted mb-0 small">Link an organization to a subscription plan</p>
  </div>
</div>

<div class="row">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          
          <div class="mb-3">
            <label class="form-label fw-semibold">Select Organization <span class="text-danger">*</span></label>
            <select name="organization" class="form-select" required>
              <option value="" disabled selected>Choose Organization...</option>
              {% for org in orgs %}
                <option value="{{ org.pk }}">{{ org.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Select Subscription Plan <span class="text-danger">*</span></label>
            <select name="plan" class="form-select" required>
              <option value="" disabled selected>Choose Plan...</option>
              {% for plan in plans %}
                <option value="{{ plan.pk }}">{{ plan.name }} ({{ org_branding.currency|default:'INR' }} {{ plan.monthly_price }}/mo)</option>
              {% endfor %}
            </select>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Start Date</label>
              <input type="date" name="start_date" class="form-control" value="{{ today }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Expiry Date (Blank = Life)</label>
              <input type="date" name="end_date" class="form-control">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Payment Status</label>
            <select name="payment_status" class="form-select">
              <option value="trial">Trial</option>
              <option value="active">Active (Paid)</option>
              <option value="pending">Payment Pending</option>
              <option value="overdue">Overdue</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Invoice Number</label>
            <input type="text" name="invoice_number" class="form-control" placeholder="e.g. INV-2026-001">
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Internal Notes</label>
            <textarea name="notes" class="form-control" rows="2" placeholder="Subscription/contract notes..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save me-1"></i>Assign Subscription</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
