{% extends 'base.html' %}
{% block title %}| Submit Support Ticket{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4 gap-2">
  <a href="{% url 'support_ticket_list' %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
  <div>
    <h4 class="fw-bold mb-0"><i class="bi bi-plus-circle me-2 text-primary"></i>Submit Support Ticket</h4>
    <p class="text-muted mb-0 small">Escalate an issue, report a bug, or request assistance from Super Admin</p>
  </div>
</div>

<div class="row">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          
          <div class="mb-3">
            <label class="form-label fw-semibold">Organization <span class="text-danger">*</span></label>
            <select name="organization" class="form-select" required>
              <option value="" disabled selected>Choose Organization...</option>
              {% for org in orgs %}
                <option value="{{ org.pk }}" {% if suggested_org == org.pk %}selected{% endif %}>{{ org.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Subject / Ticket Title <span class="text-danger">*</span></label>
            <input type="text" name="title" class="form-control" required placeholder="Brief description of the issue">
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Category</label>
              <select name="category" class="form-select">
                <option value="billing">Billing & Subscription</option>
                <option value="technical">Technical Issue / Bug</option>
                <option value="access">Access Control / Permissions</option>
                <option value="feature_request">Feature Request</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Priority</label>
              <select name="priority" class="form-select">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="critical">Critical</option>
              </select>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Detailed Description <span class="text-danger">*</span></label>
            <textarea name="description" class="form-control" rows="5" required placeholder="Describe steps to reproduce, errors seen, or help required..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary px-4 w-100 w-sm-auto"><i class="bi bi-send me-1"></i>Submit Ticket</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
