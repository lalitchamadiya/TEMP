name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        include:
          - python-version: "3.10"
            django-constraint: "Django>=4.2,<6.0"
          - python-version: "3.11"
            django-constraint: "Django>=4.2,<6.0"
          - python-version: "3.12"
            django-constraint: "Django>=5.0,<6.0"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        echo "${{ matrix.django-constraint }}" > constraints.txt
        pip install -r requirements.txt -c constraints.txt
    - name: Run Tests
      run: |
        python manage.py test
